name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # TEMPORARY: the app depends on `react-native-nobodywho` via
      # `file:../nobodywho/nobodywho/js`. npm installs that as a symlink
      # pointing outside the workspace (`../../nobodywho/...` from
      # node_modules), so clone the package into the workspace's parent
      # directory, at the exact path the symlink expects. Once the package is
      # published to npm, remove this and all following TEMPORARY steps, and
      # change the dependency in package.json to a version.
      - name: Clone nobodywho package (temporary)
        run: git clone --depth 1 --branch fetch https://github.com/nobodywho-ooo/nobodywho.git "$GITHUB_WORKSPACE/../nobodywho"

      # TEMPORARY: needed by `npm run prepack` below, which compiles the
      # nobodywho WASM module from source.
      - name: Install Emscripten SDK (temporary)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.13
          actions-cache-folder: emsdk

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # TEMPORARY: needed by `npm run prepack` below.
      - name: Install Rust toolchain (temporary)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten

      # TEMPORARY: the WASM build (llama.cpp + rust) takes a long time from
      # cold; cache the cargo target dir between runs.
      - name: Cache cargo build (temporary)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ../nobodywho/nobodywho

      # TEMPORARY: build the package from source so its `dist/` (and the
      # bundled WASM) are up to date.
      - name: Build nobodywho js package (temporary)
        working-directory: ../nobodywho/nobodywho/js
        run: |
          npm ci --no-audit --no-fund
          npm run prepack

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4
